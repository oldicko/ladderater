// Builds the plain-text export of the given view, with global 1-to-n indexing across all bands/rows
function buildExportText(view = currentView) {
    const title = CONFIG.title || 'LADDERATER';
    let text = '';
    let globalIdx = 1;

    const appendCandidates = (list, emptyText) => {
        if (list.length === 0) {
            text += `  ${emptyText}\n`;
            return;
        }
        list.forEach(c => {
            text += `  ${globalIdx}. ${c.name} (Counsellor: ${c.counsellor})\n`;
            globalIdx++;
        });
    };

    if (view === 'performance') {
        text += `${title} - Performance Board\n`;
        text += `===================================\n\n`;
        bands.forEach((b, idx) => {
            const heading = `${idx + 1}. ${b.name.toUpperCase()}`;
            text += `${heading}\n${'-'.repeat(heading.length)}\n`;
            appendCandidates(state.bands[b.id], '(No candidates ranked)');
            text += `\n`;
        });
        return text;
    }

    text += `${title} - Promotion Board\n`;
    text += `=================================\n\n`;

    let sections;
    if (isTwoTierPromoMode()) {
        sections = getPromoCapacity('expected') > 0
            ? [['EXPECTED PROMOTIONS', state.promotionBands['expected']], ['POTENTIAL PROMOTIONS', state.promotionBands['potential']]]
            : [['PROMOTIONS (UNCAPPED)', state.promotionBands['potential']]];
    } else {
        sections = promoBuckets.map(b => [b.name.toUpperCase(), state.promotionBands[b.id]]);
    }
    sections.forEach(([heading, list], idx) => {
        text += `${heading}\n${'-'.repeat(heading.length)}\n`;
        appendCandidates(list, '(No candidates allocated)');
        if (idx < sections.length - 1) {
            text += `\n`;
        }
    });
    return text;
}

// Snapshot of the whole board (data + config + rankings) for the JSON export / import round trip
function buildBoardSnapshot() {
    return {
        format: 'ladderater-board',
        formatVersion: 1,
        exportedAt: new Date().toISOString(),
        config: CONFIG,
        candidates: INITIAL_CANDIDATES,
        board: JSON.parse(serialiseState(state)).state
    };
}

// Replaces the current rankings with a saved state (candidate ids refer to positions in INITIAL_CANDIDATES)
function applySavedState(saved) {
    state = buildState(saved || {}, id => id);
    saveState();
    renderAll();
}

function csvCell(value) {
    const text = value === null || value === undefined ? '' : String(value);
    return /[",\r\n]/.test(text) ? `"${text.replace(/"/g, '""')}"` : text;
}

// CSV of every candidate with their performance band/rank and promotion bucket/rank
function buildExportCsv() {
    const perf = new Map();
    let rank = 1;
    bands.forEach(b => state.bands[b.id].forEach(c => perf.set(c.id, { band: b.name, rank: rank++ })));
    const promo = new Map();
    rank = 1;
    promoBuckets.forEach(b => (state.promotionBands[b.id] || []).forEach(c => promo.set(c.id, { bucket: b.name, rank: rank++ })));
    const rows = [['Name', 'Counsellor', 'Email', 'Performance Rank', 'Performance Band', 'Promotion Rank', 'Promotion Bucket']];
    const ordered = [...allCandidates].sort((a, b) => {
        const ra = perf.has(a.id) ? perf.get(a.id).rank : Infinity;
        const rb = perf.has(b.id) ? perf.get(b.id).rank : Infinity;
        return ra - rb || byName(a, b);
    });
    ordered.forEach(c => {
        const p = perf.get(c.id);
        const q = promo.get(c.id);
        rows.push([c.name, c.counsellor, c.email || '', p ? p.rank : '', p ? p.band : 'Unranked', q ? q.rank : '', q ? q.bucket : '']);
    });
    return rows.map(r => r.map(csvCell).join(',')).join('\r\n') + '\r\n';
}

function downloadTextFile(filename, text, mimeType) {
    const menu = document.getElementById('file-menu');
    if (menu) menu.open = false;
    const blob = new Blob([text], { type: mimeType });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function exportFileBase() {
    const slug = String(CONFIG.title || 'ladderater').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'ladderater';
    return `${slug}-${new Date().toISOString().slice(0, 10)}`;
}

function exportBoardJson() {
    downloadTextFile(`${exportFileBase()}-board.json`, JSON.stringify(buildBoardSnapshot(), null, 2), 'application/json');
}

function exportBoardCsv() {
    // BOM so Excel opens accented names correctly
    downloadTextFile(`${exportFileBase()}-rankings.csv`, '\ufeff' + buildExportCsv(), 'text/csv;charset=utf-8');
}

function exportToClipboard() {
    copyTextToClipboard(buildExportText())
        .then(showExportFeedback)
        .catch(err => {
            console.error('Failed to copy text to clipboard: ', err);
            alert('Failed to copy ordered list to clipboard.');
        });
}

// Uses the async Clipboard API where available, falling back to execCommand for insecure contexts (e.g. http://)
function copyTextToClipboard(text) {
    if (navigator.clipboard && window.isSecureContext) {
        return navigator.clipboard.writeText(text).catch(() => legacyCopyText(text));
    }
    return legacyCopyText(text);
}

function legacyCopyText(text) {
    return new Promise((resolve, reject) => {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        textarea.setAttribute('readonly', '');
        textarea.style.position = 'fixed';
        textarea.style.top = '-1000px';
        textarea.style.opacity = '0';
        document.body.appendChild(textarea);
        textarea.select();
        let copied = false;
        try {
            copied = document.execCommand('copy');
        } catch (e) {
            copied = false;
        }
        document.body.removeChild(textarea);
        if (copied) {
            resolve();
        } else {
            reject(new Error('Copy command was rejected by the browser'));
        }
    });
}

function showExportFeedback() {
    const btn = document.getElementById('btn-export-list');
    if (!btn) return;

    // Capture the original markup once, so repeated clicks can't leave the button stuck on "Copied!"
    if (exportButtonOriginalHtml === null) {
        exportButtonOriginalHtml = btn.innerHTML;
    }
    clearTimeout(exportFeedbackTimer);

    btn.innerHTML = `
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
        Copied!
    `;
    btn.style.color = '#166534';
    btn.style.backgroundColor = '#f0fdf4';
    btn.style.borderColor = '#bbf7d0';

    exportFeedbackTimer = setTimeout(() => {
        btn.innerHTML = exportButtonOriginalHtml;
        btn.style.color = '';
        btn.style.backgroundColor = '';
        btn.style.borderColor = '';
    }, 2000);
}
